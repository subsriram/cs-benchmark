# Variants exercised by `run_panel.py`.
#
# As of codesurgeon@ffffa055 (post PR #97 — "universally-useful subset"),
# only `none` ships in the released binary. The experimental v0/v1*/v2/v3*
# strategies and CS_EXPAND_DIRECTION axis (issues #69, #95, #96) live in
# branches but are gated out of the shipped CLI. Running them against this
# binary produces identical rows for every variant — wasted budget.
#
# This file is therefore reduced to `none` so panel runs reflect what end
# users actually have. The full variant set is preserved below as comments
# so it can be re-enabled when the strategy/direction env-var gates ship
# again (probably as part of an explicit feature-flag rollout).
#
# When variants come back: uncomment the blocks below and re-run.

# ── Active variants (shipped binary) ──────────────────────────────────────

[variants.none]
strategy = "none"

# ── Preserved for re-enablement when strategy/direction gates ship ───────
#
# # Strategy axis — CS_EXPAND_STRATEGY (how to rank within a walk)
# #   ranking.rs::ExpandStrategy: none/v0/v1a/v1b/v1ab/v2/v3a/v3b
# # `auto` defers to the per-anchor classifier (kind + fan-out ratio). Issue #95.
# # Default `direction = "auto"` — entries below that omit it use auto.
#
# [variants.v0]
# strategy = "v0"
#
# [variants.v1a]
# strategy = "v1a"
#
# [variants.v1b]
# strategy = "v1b"
#
# [variants.v1ab]
# strategy = "v1ab"
#
# [variants.v2]
# strategy = "v2"
#
# [variants.v3a]
# strategy = "v3a"
#
# [variants.v3b]
# strategy = "v3b"
#
# # Direction axis (#95) — strategy held at v2, direction varies
#
# [variants.v2_reverse_only]
# strategy  = "v2"
# direction = "reverse"
#
# [variants.v2_forward_only]
# strategy  = "v2"
# direction = "forward"
#
# [variants.v2_both]
# strategy  = "v2"
# direction = "both"
#
# # Best-first walkers paired with forward / both — for the chain-depth
# # bottleneck investigation in #96.
#
# [variants.v3a_forward_only]
# strategy  = "v3a"
# direction = "forward"
#
# [variants.v3b_forward_only]
# strategy  = "v3b"
# direction = "forward"
#
# [variants.v3a_both]
# strategy  = "v3a"
# direction = "both"
#
# [variants.v3b_both]
# strategy  = "v3b"
# direction = "both"
