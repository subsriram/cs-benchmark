# Reverse-expand strategy + direction variants exercised by `run_panel.py`.
#
# Two orthogonal axes, both env-gated in the codesurgeon engine:
#
#   strategy  → CS_REVERSE_EXPAND_STRATEGY  (how to rank candidates within a walk)
#              ranking.rs::ReverseExpandStrategy: none/v0/v1a/v1b/v1ab/v2/v3a/v3b
#
#   direction → CS_EXPAND_DIRECTION         (which direction to walk for each anchor)
#              ranking.rs::ExpandDirection:    auto/forward/reverse/both
#
# `auto` defers to the per-anchor classifier (kind + fan-out ratio).
# Issue #95.
#
# Default `direction = "auto"` — entries below that omit it use auto.

# ── Strategy axis (current main behavior — auto direction) ───────────────────

[variants.none]
strategy = "none"

[variants.v0]
strategy = "v0"

[variants.v1a]
strategy = "v1a"

[variants.v1b]
strategy = "v1b"

[variants.v1ab]
strategy = "v1ab"

[variants.v2]
strategy = "v2"

[variants.v3a]
strategy = "v3a"

[variants.v3b]
strategy = "v3b"

# ── Direction axis (#95) — strategy held at v2, direction varies ─────────────

[variants.v2_reverse_only]
strategy  = "v2"
direction = "reverse"

[variants.v2_forward_only]
strategy  = "v2"
direction = "forward"

[variants.v2_both]
strategy  = "v2"
direction = "both"

# Implicit `direction = "auto"` for the bare `v2` above — that's the
# baseline the directional variants compare against.
