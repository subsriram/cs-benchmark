# Reverse-expand strategy variants exercised by `run_panel.py`.
#
# Each entry is a `[variants.<id>]` table with one field, `strategy`,
# matching the values accepted by `CS_REVERSE_EXPAND_STRATEGY` in the
# codesurgeon engine. See `crates/cs-core/src/ranking.rs::ReverseExpandStrategy`
# for the full enum and `docs/reverse_expand_panel.md` for the design.

[variants.none]
strategy = "none"

[variants.v0]
strategy = "v0"

[variants.v1a]
strategy = "v1a"

[variants.v1b]
strategy = "v1b"

[variants.v1ab]
strategy = "v1ab"

[variants.v2]
strategy = "v2"

# Best-first walk with total-node budget (#69 option 3). Replaces the
# fixed (depth × fan_out) BFS with a priority queue ordered by the
# same mixed signal v2 uses. Implemented in codesurgeon b020358.
[variants.v3a]
strategy = "v3a"

# v3a + UCB exploration bonus on the parent-seed subtree.
[variants.v3b]
strategy = "v3b"
